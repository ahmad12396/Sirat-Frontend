name: PR Validation

"on":
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-messages:
    name: Commit Messages (commitlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Re-checks every commit in the PR against commitlint.config.js —
      # defense in depth for the local Husky commit-msg hook (ADR-0007),
      # since that hook can be bypassed with `git commit --no-verify`.
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
